[project]
name = "clipforge"
version = "0.1.0"
description = "Find highlights in Twitch VODs and turn them into vertical clips"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
subtitles = [
    "faster-whisper>=1.2.1",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
