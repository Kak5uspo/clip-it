[project]
name = "clip-it"
version = "0.1.0"
description = "Find highlights in Twitch VODs and turn them into vertical clips"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.5",
    "google-api-python-client>=2.202.0",
    "google-auth-oauthlib>=1.5.0",
    "pyyaml>=6",
    "tzdata>=2026.6",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
subtitles = [
    "faster-whisper>=1.2.1",
]
ai = [
    "anthropic>=2.8.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
