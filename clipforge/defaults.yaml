# clipforge defaults. Do not edit this file: put the values you want to change
# into your own config.yaml, using the same structure.

# Only reactions count: messages with an emote from the lists below, spelled-out
# laughter ("hahaha", "xD", "lol"), "???" or a hype word. Ordinary text and
# unlisted emotes are ignored, so polls, roll calls and emote greetings do not
# look like highlights. Add your channel's reaction emotes per streamer.
detect:
  burst_window_s: 5        # the "burst": reactions of the last few seconds
  baseline_window_s: 120   # how much chat history defines the normal level
  multiplier: auto         # burst must exceed baseline x this; auto = 2.5 (quiet chat) down to 1.5 (busy chat)
  min_rate: 1.0            # burst must exceed this many reactions per second
  min_z: 4.0               # robust z-score the burst must reach; filters random chat waves
  min_chatters: 5          # distinct viewers that must react in the burst window
  max_msgs_per_user: 2     # reactions per user that count per window; stops single spammers
  debounce_s: 30           # minimum distance between two highlights
  pre_roll_s: 20           # the rough clip starts this long before the chat reacts
  post_roll_s: 8           # ... and ends this long after
  top_n: 8                 # strongest highlights kept per stream
  min_score: null          # optional extra threshold on the score; null = off
  emotes:                  # reaction emotes by label (exact spelling); the strongest label names the clip
    laugh: [KEKW, LUL, LULW, OMEGALUL, ICANT, pepeLaugh]
    hype: [Pog, PogU, POGGERS, PogChamp, PagMan, LETSGO, EZ, W]
    shock: [monkaS, monkaW, WTF, HUH, "D:", NOWAY, AINTNOWAY, NotLikeThis, WutFace]
  words:                   # hype words without a label (any case): "all" plus the streamer's language
    all: ["!clip"]
    de: [digga, bruder, alter]
    en: [bro, omg, lmao]

signals:
  audio_weight: 0.5        # how much a loud moment lifts a highlight's score; 0 = ignore loudness
  skip_muted: true         # drop highlights whose audio Twitch has muted

clip:
  reserve_s: 60            # extra seconds downloaded before and after each highlight, for re-trimming

render:
  width: 1080
  height: 1920
  fps: 60
  encoder: auto            # auto, h264_nvenc, h264_amf, h264_qsv, h264_videotoolbox or libx264
  audio_kbps: 160
  loudness_lufs: -14       # loudness target; -14 is what YouTube plays back at
  credit: "twitch.tv/{login}"  # small text in the picture; "" = none
  credit_opacity: 0.6

# Applied to every entry under "streamers".
streamer_defaults:
  display_name: null       # shown in titles; defaults to the login
  language: en             # language of chat, subtitles and titles
  games: []                # only clip these Twitch categories; empty = all
  layout: blur             # blur = whole frame over a blurred background; split = facecam on top, gameplay below
  facecam_share: 0.38      # split: share of the height the facecam gets
  facecam: null            # split: where the facecam sits in the stream, e.g. {x: 0.76, y: 0.19, w: 0.24, h: 0.30}
  gameplay: null           # split: the part of the game to show, e.g. {x: 0.25, y: 0, w: 0.5, h: 1}
                           # x, y, w, h are fractions of the stream picture (0 to 1); without both
                           # rectangles a streamer is rendered as blur
  emotes: {laugh: [], hype: [], shock: []}  # channel emotes, added to the lists above
  words: []                # extra hype words
  detect: {}               # per-streamer overrides of the "detect" section

# Your streamers, keyed by Twitch login. See config.example.yaml.
streamers: {}
